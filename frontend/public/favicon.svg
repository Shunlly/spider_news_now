<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- HUD Gradient - Cyan to Purple -->
    <linearGradient id="hudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Dark background -->
  <circle cx="16" cy="16" r="15" fill="#020617"/>
  <!-- Border glow -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#hudGrad)" stroke-width="1.5" opacity="0.8"/>
  <!-- Spider web pattern - HUD style -->
  <g stroke="#22d3ee" stroke-width="0.8" fill="none" opacity="0.6" filter="url(#glow)">
    <!-- Radial lines -->
    <line x1="16" y1="5" x2="16" y2="27"/>
    <line x1="5" y1="16" x2="27" y2="16"/>
    <line x1="8" y1="8" x2="24" y2="24"/>
    <line x1="24" y1="8" x2="8" y2="24"/>
    <!-- Concentric circles -->
    <circle cx="16" cy="16" r="4"/>
    <circle cx="16" cy="16" r="8"/>
  </g>
  <!-- Center dot with glow -->
  <circle cx="16" cy="16" r="2.5" fill="#22d3ee" filter="url(#glow)"/>
  <!-- Status indicator -->
  <circle cx="24" cy="8" r="3" fill="#10b981"/>
</svg>
