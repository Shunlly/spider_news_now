<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#E7E5E4"/>

  <!-- Card Container -->
  <rect x="100" y="115" width="1000" height="400" rx="24" fill="white" filter="url(#shadow)"/>

  <!-- Logo Icon -->
  <g transform="translate(150, 200)">
    <rect width="80" height="80" rx="16" fill="#1C1917"/>
    <path d="M20 25H60M20 40H50M20 55H55" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="20" r="8" fill="#22C55E"/>
  </g>

  <!-- Title -->
  <text x="260" y="250" font-family="Inter, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#1C1917">Spider News</text>
  <text x="260" y="310" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#78716C">新闻采集系统管理仪表盘</text>

  <!-- Features -->
  <g transform="translate(150, 380)">
    <rect width="200" height="60" rx="12" fill="#F5F5F4" stroke="#E7E5E4" stroke-width="1"/>
    <text x="100" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#44403C" text-anchor="middle">实时监控</text>
  </g>
  <g transform="translate(380, 380)">
    <rect width="200" height="60" rx="12" fill="#F5F5F4" stroke="#E7E5E4" stroke-width="1"/>
    <text x="100" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#44403C" text-anchor="middle">智能采集</text>
  </g>
  <g transform="translate(610, 380)">
    <rect width="200" height="60" rx="12" fill="#F5F5F4" stroke="#E7E5E4" stroke-width="1"/>
    <text x="100" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#44403C" text-anchor="middle">多源聚合</text>
  </g>

  <!-- Shadow Definition -->
  <defs>
    <filter id="shadow" x="-20" y="-20" width="1040" height="440" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
</svg>
