# =============================================================
# Grafana Dashboard Provisioning Configuration
# =============================================================

apiVersion: 1

providers:
  - name: 'News Scraper Dashboards'
    orgId: 1
    folder: ''
    folderUid: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
