# =============================================================
# Docker Compose - Production Configuration for 1Panel
# =============================================================
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Copy .env.example to .env and configure all variables
#   2. Ensure all required ports are available
#   3. For GitHub Actions deployment, set GITHUB_REPOSITORY env var
# =============================================================

services:
  # =============================================================
  # Database Services
  # =============================================================
  mysql:
    image: mysql:8.0
    container_name: news_scraper_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-news_scraper}
      MYSQL_USER: ${MYSQL_USER:-news_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-33060}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7.2-alpine
    container_name: news_scraper_redis
    restart: always
    ports:
      - "${REDIS_PORT:-63790}:6379"
    volumes:
      - redis_data:/data
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  # =============================================================
  # Search Engine
  # =============================================================
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: news_scraper_meilisearch
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 1024Mb
      MEILI_MAX_INDEXING_THREADS: 2
    ports:
      - "${MEILI_PORT:-7701}:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # =============================================================
  # Object Storage - RustFS (S3 Compatible)
  # =============================================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: news_scraper_rustfs
    restart: always
    user: "10001:10001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    ports:
      - "${RUSTFS_API_PORT:-9010}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9011}:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # =============================================================
  # Application Services
  # =============================================================
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-shunlly/spider_news_now}/backend:latest
    container_name: news_scraper_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      # Database - 使用独立变量，应用程序会自动构建 URL 并处理特殊字符
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-news_user}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-news_scraper}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Meilisearch
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY}
      # RustFS (S3 Compatible)
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: rustfs:9000
      MINIO_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      MINIO_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-news-scraper}
      MINIO_SECURE: "false"
      # Application
      API_V1_PREFIX: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      SECRET_KEY: ${SECRET_KEY}
      FERNET_KEY: ${FERNET_KEY}
      TZ: Asia/Shanghai
      # Performance
      WORKERS: ${WORKERS:-4}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - backend_logs:/app/logs
      - backend_exports:/app/exports
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: |
      sh -c 'alembic upgrade head && gunicorn app.main:app -w $${WORKERS:-4} -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --timeout 120 --keep-alive 5 --access-logfile - --error-logfile - --capture-output'
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-shunlly/spider_news_now}/frontend:latest
    container_name: news_scraper_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # =============================================================
  # Monitoring Services
  # =============================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: news_scraper_prometheus
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - news_scraper_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  grafana:
    image: grafana/grafana:10.4.0
    container_name: news_scraper_grafana
    restart: always
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Exporters for Metrics Collection
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: news_scraper_node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - news_scraper_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: news_scraper_mysql_exporter
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - '--mysqld.username=root'
      - '--mysqld.address=mysql:3306'
    networks:
      - news_scraper_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: news_scraper_redis_exporter
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - news_scraper_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

# =============================================================
# Volumes
# =============================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  rustfs_data:
    driver: local
  backend_logs:
    driver: local
  backend_exports:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# =============================================================
# Networks
# =============================================================
networks:
  news_scraper_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
