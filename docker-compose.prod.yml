# =============================================================
# Docker Compose - Production Configuration for 1Panel
# =============================================================
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Copy .env.example to .env and configure all variables
#   2. Ensure all required ports are available
#   3. For GitHub Actions deployment, set GITHUB_REPOSITORY env var
# =============================================================

services:
  # =============================================================
  # Database Services
  # =============================================================
  mysql:
    image: mysql:8.0
    container_name: news_scraper_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-news_scraper}
      MYSQL_USER: ${MYSQL_USER:-news_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-33060}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7.2-alpine
    container_name: news_scraper_redis
    restart: always
    ports:
      - "${REDIS_PORT:-63790}:6379"
    volumes:
      - redis_data:/data
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  # =============================================================
  # Search Engine
  # =============================================================
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: news_scraper_meilisearch
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 1024Mb
      MEILI_MAX_INDEXING_THREADS: 2
    ports:
      - "${MEILI_PORT:-7701}:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # =============================================================
  # Object Storage - RustFS (S3 Compatible)
  # =============================================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: news_scraper_rustfs
    restart: always
    user: "10001:10001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    ports:
      - "${RUSTFS_API_PORT:-9010}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9011}:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # =============================================================
  # Application Services
  # =============================================================
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-shunlly/spider_news_now}/backend:latest
    container_name: news_scraper_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-news_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-news_scraper}
      SCHEDULER_JOBSTORE_URL: mysql+pymysql://${MYSQL_USER:-news_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-news_scraper}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Meilisearch
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY}
      # RustFS (S3 Compatible)
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: rustfs:9000
      MINIO_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      MINIO_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-news-scraper}
      MINIO_SECURE: "false"
      # Application
      API_V1_PREFIX: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      SECRET_KEY: ${SECRET_KEY}
      FERNET_KEY: ${FERNET_KEY}
      TZ: Asia/Shanghai
      # Performance
      WORKERS: ${WORKERS:-4}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - backend_logs:/app/logs
      - backend_exports:/app/exports
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      sh -c "
        alembic upgrade head &&
        gunicorn app.main:app
        -w $${WORKERS:-4}
        -k uvicorn.workers.UvicornWorker
        -b 0.0.0.0:8000
        --timeout 120
        --keep-alive 5
        --access-logfile -
        --error-logfile -
        --capture-output
      "
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-shunlly/spider_news_now}/frontend:latest
    container_name: news_scraper_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

# =============================================================
# Volumes
# =============================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  rustfs_data:
    driver: local
  backend_logs:
    driver: local
  backend_exports:
    driver: local

# =============================================================
# Networks
# =============================================================
networks:
  news_scraper_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
