# =============================================================
# Docker Compose - Production Configuration
# =============================================================
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Copy .env.example to .env and configure all variables
#   2. Ensure all required ports are available
# =============================================================

version: '3.8'

services:
  # =============================================================
  # Database Services
  # =============================================================
  mysql:
    image: mysql:8.0
    container_name: news_scraper_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7.2-alpine
    container_name: news_scraper_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  # =============================================================
  # Search Engine
  # =============================================================
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: news_scraper_meilisearch
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 1024Mb
      MEILI_MAX_INDEXING_THREADS: 2
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # =============================================================
  # Object Storage
  # =============================================================
  minio:
    image: minio/minio:latest
    container_name: news_scraper_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # =============================================================
  # Application Services
  # =============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: news_scraper_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      SCHEDULER_JOBSTORE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Meilisearch
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY}
      # MinIO
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-news-scraper}
      MINIO_SECURE: "false"
      # Application
      API_V1_PREFIX: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      SECRET_KEY: ${SECRET_KEY}
      FERNET_KEY: ${FERNET_KEY}
      TZ: Asia/Shanghai
      # Performance
      WORKERS: ${WORKERS:-4}
    volumes:
      - backend_logs:/app/logs
      - backend_exports:/app/exports
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      sh -c "
        alembic upgrade head &&
        gunicorn app.main:app
        -w $${WORKERS:-4}
        -k uvicorn.workers.UvicornWorker
        -b 0.0.0.0:8000
        --timeout 120
        --keep-alive 5
        --access-logfile -
        --error-logfile -
        --capture-output
      "
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: news_scraper_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # =============================================================
  # Reverse Proxy (Optional - for HTTPS)
  # =============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: news_scraper_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

# =============================================================
# Volumes
# =============================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  minio_data:
    driver: local
  backend_logs:
    driver: local
  backend_exports:
    driver: local
  nginx_cache:
    driver: local

# =============================================================
# Networks
# =============================================================
networks:
  news_scraper_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
