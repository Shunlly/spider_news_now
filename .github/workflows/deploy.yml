name: Deploy to 1Panel Server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      clean_deploy:
        description: 'Clean deploy (remove all containers and volumes)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/backend:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/frontend:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Copy docker-compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.DEPLOY_PATH || '/opt/app/spider_news_now' }}

      - name: Deploy to 1Panel Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_NAME: ${{ steps.repo.outputs.name }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          # Environment variables for .env file
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
          MEILI_PORT: ${{ secrets.MEILI_PORT }}
          RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
          RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
          RUSTFS_API_PORT: ${{ secrets.RUSTFS_API_PORT }}
          RUSTFS_CONSOLE_PORT: ${{ secrets.RUSTFS_CONSOLE_PORT }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          WORKERS: ${{ secrets.WORKERS }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          CLEAN_DEPLOY: ${{ github.event.inputs.clean_deploy || 'false' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: REPO_NAME,GHCR_TOKEN,GITHUB_ACTOR,MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD,MYSQL_PORT,REDIS_PORT,MEILI_MASTER_KEY,MEILI_PORT,RUSTFS_ACCESS_KEY,RUSTFS_SECRET_KEY,RUSTFS_API_PORT,RUSTFS_CONSOLE_PORT,MINIO_BUCKET,SECRET_KEY,FERNET_KEY,LOG_LEVEL,WORKERS,ALLOWED_ORIGINS,CLEAN_DEPLOY
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/app/spider_news_now' }}

            # Generate .env file from GitHub Secrets
            cat > .env <<EOF
            # Auto-generated by GitHub Actions - DO NOT EDIT MANUALLY
            GITHUB_REPOSITORY=${REPO_NAME}
            MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE=${MYSQL_DATABASE:-news_scraper}
            MYSQL_USER=${MYSQL_USER:-news_user}
            MYSQL_PASSWORD=${MYSQL_PASSWORD}
            MYSQL_PORT=${MYSQL_PORT:-33060}
            REDIS_PORT=${REDIS_PORT:-63790}
            MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
            MEILI_PORT=${MEILI_PORT:-7701}
            RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
            RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
            RUSTFS_API_PORT=${RUSTFS_API_PORT:-9010}
            RUSTFS_CONSOLE_PORT=${RUSTFS_CONSOLE_PORT:-9011}
            MINIO_BUCKET=${MINIO_BUCKET:-news-scraper}
            SECRET_KEY=${SECRET_KEY}
            FERNET_KEY=${FERNET_KEY}
            LOG_LEVEL=${LOG_LEVEL:-WARNING}
            WORKERS=${WORKERS:-4}
            ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
            EOF
            # Remove leading whitespace from .env file
            sed -i 's/^[[:space:]]*//' .env

            # Login to GitHub Container Registry
            echo $GHCR_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

            # Pull latest images
            docker pull ghcr.io/$REPO_NAME/backend:latest
            docker pull ghcr.io/$REPO_NAME/frontend:latest

            # Clean deploy: remove all containers and volumes for fresh start
            if [ "${CLEAN_DEPLOY}" = "true" ]; then
              echo "=== CLEAN DEPLOY: Removing all containers and volumes ==="
              docker-compose -f docker-compose.prod.yml down -v --remove-orphans
              echo "=== Starting fresh deployment ==="
              docker-compose -f docker-compose.prod.yml up -d
            else
              # Normal deploy: just recreate backend and frontend
              docker-compose -f docker-compose.prod.yml pull
              docker-compose -f docker-compose.prod.yml up -d --force-recreate backend frontend
            fi

            # Cleanup old images
            docker image prune -f

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/app/spider_news_now' }}
            echo "Waiting for backend to be healthy..."
            echo "Checking container status..."
            docker-compose -f docker-compose.prod.yml ps
            max_attempts=30
            attempt=0
            while [ $attempt -lt $max_attempts ]; do
              attempt=$((attempt + 1))
              echo "Health check attempt $attempt/$max_attempts..."
              if curl -sf http://localhost:8001/api/v1/health > /dev/null 2>&1; then
                echo "Deployment successful! Backend is healthy."
                exit 0
              fi
              sleep 10
            done
            echo "Health check failed after $max_attempts attempts"
            echo "=== Container Status ==="
            docker-compose -f docker-compose.prod.yml ps
            echo "=== Backend Logs ==="
            docker-compose -f docker-compose.prod.yml logs --tail=100 backend
            exit 1
