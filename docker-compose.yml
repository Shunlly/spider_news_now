services:
  mysql:
    image: mysql:8.0
    container_name: news_scraper_mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-news_scraper}
      MYSQL_USER: ${MYSQL_USER:-news_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-news_password}
      TZ: Asia/Shanghai
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - 用于 Bloom Filter 去重和缓存
  redis:
    image: redis:7.2-alpine
    container_name: news_scraper_redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      - "63790:6379"
    volumes:
      - redis_data:/data
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Meilisearch - 全文检索引擎
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: news_scraper_meilisearch
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7701:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RustFS - S3 兼容的高性能对象存储 (MinIO 替代)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: news_scraper_rustfs
    restart: unless-stopped
    user: "10001:10001"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin123}
    ports:
      - "9010:9000"   # S3 API 端口
      - "9011:9001"   # Console 端口
    volumes:
      - rustfs_data:/data
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news_scraper_backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      # 数据库配置
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-news_user}:${MYSQL_PASSWORD:-news_password}@mysql:3306/${MYSQL_DATABASE:-news_scraper}
      SCHEDULER_JOBSTORE_URL: mysql+pymysql://${MYSQL_USER:-news_user}:${MYSQL_PASSWORD:-news_password}@mysql:3306/${MYSQL_DATABASE:-news_scraper}
      # Redis 配置
      REDIS_URL: redis://redis:6379/0
      # Meilisearch 配置
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-masterKey123}
      # RustFS 配置 (S3 兼容)
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: rustfs:9000
      MINIO_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      MINIO_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-news-scraper}
      MINIO_SECURE: "false"
      # API 配置
      API_V1_PREFIX: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS: http://localhost,http://localhost:3000,http://localhost:5173,http://frontend
      TZ: Asia/Shanghai
    ports:
      - "8001:8000"
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - news_scraper_network
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: news_scraper_frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    depends_on:
      - backend
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:80"
    networks:
      - news_scraper_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  rustfs_data:
    driver: local

networks:
  news_scraper_network:
    driver: bridge
