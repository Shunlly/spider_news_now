<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- HUD Background -->
  <rect width="1200" height="630" fill="#020617"/>

  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(6,182,212,0.1)" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow Circle -->
  <circle cx="200" cy="315" r="300" fill="url(#glowGrad)" opacity="0.5"/>

  <!-- Card Container - HUD Style -->
  <rect x="100" y="115" width="1000" height="400" rx="24" fill="rgba(15,23,42,0.8)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>

  <!-- Logo Icon - HUD Style -->
  <g transform="translate(150, 200)">
    <rect width="80" height="80" rx="16" fill="rgba(6,182,212,0.2)" stroke="rgba(6,182,212,0.5)" stroke-width="1"/>
    <path d="M20 25H60M20 40H50M20 55H55" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="20" r="8" fill="#10b981"/>
  </g>

  <!-- Title - HUD Style -->
  <text x="260" y="250" font-family="Inter, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#f1f5f9">Spider News</text>
  <text x="260" y="310" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#94a3b8">新闻采集系统管理仪表盘</text>

  <!-- Features - HUD Style -->
  <g transform="translate(150, 380)">
    <rect width="200" height="60" rx="12" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
    <text x="100" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#22d3ee" text-anchor="middle">实时监控</text>
  </g>
  <g transform="translate(380, 380)">
    <rect width="200" height="60" rx="12" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
    <text x="100" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#c084fc" text-anchor="middle">智能采集</text>
  </g>
  <g transform="translate(610, 380)">
    <rect width="200" height="60" rx="12" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <text x="100" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#34d399" text-anchor="middle">多源聚合</text>
  </g>

  <!-- Scan Line Effect -->
  <rect x="100" y="115" width="1000" height="2" fill="url(#glowGrad)" opacity="0.5"/>
</svg>
